[project]
name = "async-parser"
version = "0.1.0"
description = "Парсер с торгов СПб биржи"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp (>=3.14.1,<4.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "xlrd (>=2.0.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "mypy (>=2.3.0,<3.0.0)",
    "lxml (>=6.1.1,<7.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "tqdm (>=4.69.0,<5.0.0)",
    "faker (>=40.35.0,<41.0.0)",
    "pika (>=1.4.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.22,<0.16.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "types-tqdm (>=4.69.0.20260720,<5.0.0.0)"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
explicit_package_bases = true
exclude = "(^|/)(alembic|laba_.*)(/|$)"
